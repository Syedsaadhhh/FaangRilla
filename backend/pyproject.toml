[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opendoor-relay"
version = "0.1.0"
description = "OpenDoor Relay - Accessibility Continuity Engine for Community Events"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opendoor_relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
